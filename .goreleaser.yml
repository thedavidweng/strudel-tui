version: 2

builds:
  - id: strudel-tui
    builder: bun
    binary: strudel-tui
    main: src/index.ts
    targets:
      - darwin-arm64
      - darwin-x64
      - linux-arm64
      - linux-x64
      - windows-x64
    flags:
      - --compile

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"
    files:
      - patterns/
      - README.md
      - LICENSE

release:
  github:
    owner: strudel-tui
    name: strudel-tui

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
