version: 2

builds:
  - id: strudel-tui
    builder: bun
    binary: strudel-tui
    main: src/index.ts
    targets:
      - darwin-arm64
      - darwin-x64
      - linux-arm64
      - linux-x64
      - windows-x64
    flags:
      - --compile

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"
    files:
      - patterns/
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

signs:
  - artifacts: checksum
    cmd: cosign
    output: true
    args:
      - "sign-blob"
      - "--yes"
      - "--bundle=${signature}"
      - "${artifact}"

sboms:
  - cmd: syft
    artifacts: archive
    args:
      - "${artifact}"
      - --output
      - spdx-json=${document}
    documents:
      - "${artifact}.spdx.json"

changelog:
  disable: true

release:
  mode: keep-existing
  github:
    owner: thedavidweng
    name: strudel-tui
  header: |
    ## Installation

    **Homebrew (macOS):**
    ```
    brew tap thedavidweng/tap
    brew install --cask strudel-tui
    ```

    **Pre-built binaries:** Download below and verify with `checksums.txt`.

    ## Verify signatures

    This release is signed with [Sigstore](https://sigstore.dev) keyless signing.
    To verify the checksums file:
    ```
    cosign verify-blob \
      --bundle checksums.txt.sig \
      --certificate-identity-regexp="https://github.com/thedavidweng/strudel-tui" \
      --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
      checksums.txt
    ```

homebrew_casks:
  - name: strudel-tui
    binaries:
      - strudel-tui
    repository:
      owner: thedavidweng
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/thedavidweng/strudel-tui"
    description: "Terminal-based live coding interface for Strudel with AI agent"
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/strudel-tui"]
          end
