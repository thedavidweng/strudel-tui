name: Release Please

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          token: ${{ github.token }}

      # GITHUB_TOKEN-created PRs and tags do not trigger other workflows.
      - name: Check the release PR head
        if: ${{ steps.rp.outputs.prs_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_PRS: ${{ steps.rp.outputs.prs }}
        run: |
          set -euo pipefail
          while IFS= read -r number; do
            pr="$(gh api "repos/$GH_REPO/pulls/$number")"
            if [ "$(jq -r .draft <<< "$pr")" = true ]; then
              echo "Release PR #$number is a draft; checks remain skipped"
              continue
            fi
            ref="$(jq -r .head.ref <<< "$pr")"
            base="$(jq -r .base.sha <<< "$pr")"
            echo "Dispatching checks for release PR #$number at $(jq -r .head.sha <<< "$pr")"
            gh workflow run ci.yml --ref "$ref" -f pull_request_number="$number" -f base_sha="$base"
            gh workflow run smoke.yml --ref "$ref" -f pull_request_number="$number"
            gh workflow run security.yml --ref "$ref" -f pull_request_number="$number"
            gh workflow run workflow-lint.yml --ref "$ref" -f pull_request_number="$number"
          done < <(jq -r '.[].number' <<< "$RELEASE_PRS")

      - name: Dispatch release packaging
        if: ${{ steps.rp.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ steps.rp.outputs.tag_name }}
        run: gh workflow run release.yml --ref "$TAG_NAME" -f tag_name="$TAG_NAME"
