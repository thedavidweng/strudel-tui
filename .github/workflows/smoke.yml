name: Smoke Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  cli-smoke:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.11

      - run: bun install --frozen-lockfile

      - name: Build binary
        run: bun run build

      - name: Binary exists and is executable
        run: |
          test -f bin/strudel-tui
          test -x bin/strudel-tui || chmod +x bin/strudel-tui

      - name: CLI --help works
        run: ./bin/strudel-tui --help 2>&1 | head -20

      - name: CLI --version works
        run: ./bin/strudel-tui --version 2>&1

      - name: Config subcommand available
        run: ./bin/strudel-tui config --help 2>&1 | head -10

      - name: Pattern loader works (list built-in patterns)
        run: |
          # Verify patterns directory exists
          test -d patterns

      - name: Import test (source-level)
        run: |
          # Verify all source modules import without error (entrypoint excluded: it runs the CLI)
          bun -e "
            const glob = new Bun.Glob('src/**/*.ts');
            let n = 0;
            for await (const f of glob.scan('.')) {
              if (f.endsWith('.d.ts') || f === 'src/index.ts') continue;
              await import('./' + f);
              n++;
            }
            if (n === 0) throw new Error('no modules found');
            console.log(n + ' modules imported OK');
          "
