version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
    reviewers:
      - thedavidweng
    ignore:
      - dependency-name: chalk
        update-types: ["version-update:semver-major"]
      - dependency-name: "@earendil-works/pi-tui"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
    groups:
      npm-non-major:
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 7
      semver-major-days: 10
      semver-minor-days: 7
      semver-patch-days: 3
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    reviewers:
      - thedavidweng
    ignore:
      - dependency-name: googleapis/release-please-action
        update-types: ["version-update:semver-major"]
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 5
