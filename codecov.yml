coverage:
  status:
    project:
      default:
        target: auto
        threshold: 2%
    patch:
      default:
        target: 80%

  precision: 1
  round: down
  range: "60...100"

component_management:
  individual_components:
    - component_id: agent
      name: agent
      paths:
        - src/agent/**
    - component_id: audio
      name: audio
      paths:
        - src/audio/**
    - component_id: config
      name: config
      paths:
        - src/config/**
    - component_id: engine
      name: engine
      paths:
        - src/engine/**
    - component_id: llm
      name: llm
      paths:
        - src/llm/**
    - component_id: tui
      name: tui
      paths:
        - src/tui/**

comment:
  layout: "header, diff, components, files"
  require_changes: true
